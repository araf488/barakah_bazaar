# barakahstore.org on the shared VM. Install as /etc/nginx/sites-available/barakahstore and
# enable it; certbot --nginx then adds the 443 server and the http -> https redirect.
#
# The real client address: /etc/nginx/conf.d/cloudflare-real-ip.conf (already on the VM for
# mediguideapp.com) turns Cloudflare's address into the client's in $remote_addr. The API trusts
# exactly one proxy hop (TRUST_PROXY_HOPS=1, this nginx), so X-Forwarded-For carries only that
# address, never a value the client sent.
server {
    listen 80;
    listen [::]:80;
    server_name barakahstore.org www.barakahstore.org;

    # Product images and admin uploads go straight to storage; requests here stay small.
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
